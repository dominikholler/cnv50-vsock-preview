ansible_connection: ssh
# A virtctl with --vsock (upstream KubeVirt 1.10, see step 2 of the guide).
# Use an absolute path, or a name that's on your PATH.
virtctl_path: virtctl
ansible_ssh_private_key_file: ~/.ssh/vsock_test
# Same proxy that `virtctl ssh --vsock` uses.
ansible_ssh_common_args: >-
  -o ProxyCommand="{{ virtctl_path }} port-forward --stdio=true --vsock --vsock-tls=false
  vmi/{{ vm_name }}/{{ vm_namespace }} 22"
  -o HostKeyAlias={{ vm_name }}.{{ vm_namespace }}
  -o UserKnownHostsFile=~/.ssh/kubevirt_vsock_known_hosts
  -o StrictHostKeyChecking=accept-new
